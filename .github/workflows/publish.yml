# npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
#
# Claim this workflow on npm for EACH package (core and v5 are already claimed):
#   Organization or user: brandonscript
#   Repository:            mui-flexy
#   Workflow filename:     publish.yml
#   Environment name:      (leave blank)
#   Allowed actions:       npm publish
#
# Packages: @mui-flexy/core, @mui-flexy/v5, @mui-flexy/v6, @mui-flexy/v7, @mui-flexy/v9
# Docs: https://docs.npmjs.com/trusted-publishers/

name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not set registry-url. setup-node writes an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, which blocks OIDC when the token is empty.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn jest --silent --verbose=false --reporters=summary --passWithNoTests

      - name: Typecheck
        run: yarn typecheck

      - name: Publish packages
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          ./scripts/publish.sh
        env:
          NPM_TRUSTED_PUBLISHING: "true"
