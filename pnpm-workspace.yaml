packages:
  - packages/*
  - fixtures/*
  - docs

# Install explicitly; build/release commands must not silently resolve dependencies.
verifyDepsBeforeRun: false

# Preserve the dependency pins used by Yarn.
overrides:
  "@emotion/react": "^11.14.0"
  "@emotion/styled": "^11.14.0"
  "@types/react": "^18.3.20"
  "@types/react-dom": "^18.3.6"
  "@types/react-syntax-highlighter": "^15.5.13"
  "react": "^18.3.1"
  "react-dom": "^18.3.1"
  "react-syntax-highlighter": "^15.6.1"
  "webpack": "^5.99.5"
  "webpack-cli": "^5.1.4"
  "webpack-dev-server": "^5.1.0"
  "html-webpack-plugin": "^5.6.3"
  "babel-loader": "^9.2.1"
  "typescript": "^5.8.3"
  "rollup": "^4.39.0"

# Native compiler bindings needed by the builds.
allowBuilds:
  "@swc/core": true
  "unrs-resolver": true
